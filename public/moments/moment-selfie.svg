<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff1f2"/>
      <stop offset="0.5" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="hair" x1="120" y1="20" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3d272a"/>
      <stop offset="1" stop-color="#1c1318"/>
    </linearGradient>
    <linearGradient id="skin" x1="140" y1="50" x2="180" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde2d2"/>
      <stop offset="1" stop-color="#f7c8b0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <!-- Polaroid border effect -->
  <rect x="12" y="12" width="296" height="216" rx="12" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
  
  <!-- Mini background -->
  <rect x="24" y="24" width="272" height="155" rx="8" fill="#fdf2f8"/>
  <circle cx="80" cy="60" r="30" fill="#fce7f3" opacity="0.6"/>
  <circle cx="240" cy="70" r="40" fill="#fce7f3" opacity="0.5"/>

  <!-- Angel Portrait In Selfie Frame -->
  <g transform="translate(80, 10)">
    <!-- Hair back -->
    <path fill="url(#hair)" d="M45 80c-4-32 14-58 40-59 26-1 42 18 42 52v26H45V80Z"/>
    <!-- Outfit -->
    <path fill="#f43f5e" d="M30 150c4-28 18-46 45-52l10 13 11-13c27 6 41 24 45 52H30Z"/>
    <!-- Face -->
    <path fill="url(#skin)" d="M64 70c0-18 10-32 22-32s22 14 22 32v15c0 16-10 27-22 27S64 101 64 85V70Z"/>
    <!-- Bangs -->
    <path fill="url(#hair)" d="M60 67c-2-18 8-36 25-36 20 0 29 15 29 34-8-4-15-12-18-18-9 12-23 18-36 20Z"/>
    <!-- Sparkling Eyes with wink -->
    <ellipse cx="76" cy="74" rx="4" ry="5" fill="#241419"/>
    <circle cx="75" cy="72" r="1.5" fill="#fff"/>
    <!-- Winking eye -->
    <path stroke="#241419" stroke-width="2" stroke-linecap="round" d="M92 75 Q 97 71 102 75"/>
    <!-- Sweet smile with tongue out or dimple -->
    <path stroke="#be123c" stroke-width="2" stroke-linecap="round" d="M80 87 Q 86 92 92 87"/>
    <ellipse cx="73" cy="81" rx="6" ry="3.5" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="100" cy="81" rx="6" ry="3.5" fill="#f43f5e" opacity="0.4"/>
    <!-- Hand holding phone / peace sign -->
    <circle cx="125" cy="110" r="10" fill="#fde2d2"/>
    <rect x="120" y="90" width="8" height="22" rx="4" fill="#fde2d2"/>
    <rect x="130" y="94" width="7" height="20" rx="3.5" fill="#fde2d2"/>
  </g>

  <!-- Polaroid Bottom Handwritten Caption -->
  <text x="160" y="205" text-anchor="middle" font-family="'Caveat', 'Playfair Display', cursive, serif" font-size="16" font-weight="700" fill="#9f1239">“Eto late e ashcho keno? 🙄 Miss korchilam tomai! ♡”</text>
</svg>

