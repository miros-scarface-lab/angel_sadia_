<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cup" x1="120" y1="80" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="coffee" x1="130" y1="100" x2="190" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78350f"/>
      <stop offset="1" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <!-- Table surface -->
  <path d="M0 160 Q 160 150 320 160 L 320 240 L 0 240 Z" fill="#e2d4cb" opacity="0.6"/>
  <!-- Saucer -->
  <ellipse cx="160" cy="170" rx="65" ry="18" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
  <ellipse cx="160" cy="168" rx="55" ry="14" fill="#fdf2f8"/>
  <!-- Cup handle -->
  <path d="M195 125 C 220 125 220 155 195 155" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Cup body -->
  <path d="M125 110 L 132 165 C 133 172 187 172 188 165 L 195 110 Z" fill="url(#cup)" stroke="#fbcfe8" stroke-width="2"/>
  <!-- Coffee top -->
  <ellipse cx="160" cy="112" rx="33" ry="10" fill="url(#coffee)"/>
  <!-- Latte art heart -->
  <path d="M160 115 C 156 109 150 109 150 113 C 150 117 160 121 160 121 C 160 121 170 117 170 113 C 170 109 164 109 160 115 Z" fill="#fff" opacity="0.85"/>
  <!-- Steam curls -->
  <path d="M150 95 Q 145 80 152 70 Q 158 60 154 50" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M168 90 Q 175 78 168 68 Q 162 58 168 46" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Sparkles & hearts -->
  <path d="M70 70 L 73 60 L 76 70 L 86 73 L 76 76 L 73 86 L 70 76 L 60 73 Z" fill="#fb7185" opacity="0.6"/>
  <path d="M250 80 C 246 76 240 76 240 80 C 240 84 250 88 250 88 C 250 88 260 84 260 80 C 260 76 254 76 250 80 Z" fill="#f43f5e" opacity="0.6"/>
  <text x="160" y="215" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#831843">Cozy coffee date with you ☕</text>
</svg>

